name: Apply game size update from issue

on:
  issues:
    types: [edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  apply:
    if: contains(github.event.issue.labels.*.name, 'game-update')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests

      - name: Apply update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/apply_size_update.py
