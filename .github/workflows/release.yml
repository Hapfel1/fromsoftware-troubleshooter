# Builds the Linux AppImage and the Windows exe on every push and pull
# request. On a push to master whose pyproject.toml version has no release
# tag yet, the builds are attached to a draft GitHub release for that
# version (recreated on each push until it is published). Publishing the
# draft starts nexusmods-upload.yml.
#
# Optional secrets:
#   CODE_SIGNING_CERT      Base64-encoded PFX certificate for Windows signing
#   CODE_SIGNING_PASSWORD  Password for the PFX certificate

name: Build & Release

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Lint
        run: uv run --locked ruff check .

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version=$(grep -Po '(?<=^version = ")[^"]*' pyproject.toml)
          package=$(grep -Po '(?<=^__version__ = ")[^"]*' fromsoftware_troubleshooter/__init__.py)
          if [ "$version" != "$package" ]; then
            echo "::error::pyproject.toml has $version, fromsoftware_troubleshooter/__init__.py has $package"
            exit 1
          fi

          # Older releases were tagged without the patch part (v1.8 for 1.8.0).
          released=false
          if [ -n "$(git tag -l "v$version")" ]; then
            released=true
          elif [[ "$version" == *.0 ]] && [ -n "$(git tag -l "v${version%.0}")" ]; then
            released=true
          fi

          release=false
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] \
            && [ "$GITHUB_REF" = "refs/heads/master" ] \
            && [ "$released" = false ]; then
            release=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version, already released: $released, draft release: $release"

  build-linux:
    name: Build Linux
    needs: plan
    runs-on: ubuntu-24.04
    # The oldest supported Ubuntu LTS keeps the AppImage's glibc requirement
    # at 2.35 instead of the runner's.
    container: ubuntu:22.04
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # A uv-managed Python has a Tk without Xft, which renders bitmap fonts.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl binutils file \
            libtk8.6 libtcl8.6 libxft2 libxss1 libx11-6 libfontconfig1 \
            libsqlite3-0 libffi8 libssl3 libbz2-1.0 liblzma5 zlib1g libncursesw6 \
            libuuid1 libgdbm6

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        env:
          # The host tool cache holds a Python built for the host's glibc.
          AGENT_TOOLSDIRECTORY: /opt/toolcache
          PIP_NO_CACHE_DIR: "1"
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Build AppImage
        run: |
          uv run python -m PyInstaller --clean --noconfirm fromsoftware_troubleshooter_linux.spec
          sh ./build_appimage.sh
          mkdir -p release
          mv "dist/FromSoftware-Troubleshooter-${VERSION}-x86_64.AppImage" \
            "release/FromSoftware-Troubleshooter_${VERSION}_Linux.AppImage"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: release/*.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: plan
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CODE_SIGNING_CERT: ${{ secrets.CODE_SIGNING_CERT }}
      CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Build exe
        run: uv run python -m PyInstaller --clean --noconfirm fromsoftware_troubleshooter_windows.spec

      - name: Sign exe
        if: env.CODE_SIGNING_CERT != '' && needs.plan.outputs.release == 'true'
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("sign.pfx", [Convert]::FromBase64String($env:CODE_SIGNING_CERT))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Select-Object -First 1
          & $signtool sign /f sign.pfx /p $env:CODE_SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\FromSoftware Troubleshooter.exe"
          $code = $LASTEXITCODE
          Remove-Item sign.pfx
          exit $code

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path "dist\FromSoftware Troubleshooter.exe" `
            -DestinationPath "release\FromSoftware-Troubleshooter_$($env:VERSION)_Windows.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: release/*.zip
          if-no-files-found: error

  release:
    name: Draft release
    needs: [plan, build-linux, build-windows]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Create draft release
        run: |
          set -euo pipefail
          # Drafts carry no tag yet, so each push replaces the previous draft.
          gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | .tagName' |
          while read -r tag; do
            echo "Deleting draft $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done

          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --draft
